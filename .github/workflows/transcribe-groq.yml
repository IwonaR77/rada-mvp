name: Transkrypcja sesji (Groq)

# Docelowy, zaplanowany pipeline transkrypcji nowych sesji przez Groq API —
# patrz Faza 4 planu migracji. Realny wolumen to ~2-3 sesje/miesiąc, więc
# harmonogram jest celowo rzadki; orkiestrator (whisper/pipeline-groq.mjs)
# i tak przetwarza najwyżej jedną sesję na uruchomienie i jest bezpieczny
# do wywoływania powtarzalnie/często, gdyby trzeba było to kiedyś zagęścić.
on:
  schedule:
    - cron: "0 6 * * *" # codziennie 06:00 UTC
  workflow_dispatch: {} # ręczne odpalenie z zakładki Actions, do testów

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Zainstaluj ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Zainstaluj zależności
        run: npm ci

      - name: Uruchom orkiestrator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node groq/pipeline-groq.mjs
